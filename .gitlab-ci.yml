stages:
  - test
  - build
  - deploy
  - verify

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  GIT_DEPTH: "1"

default:
  interruptible: false
  tags: [ci-docker]

# ─── Shared Templates ──────────────────────────────────────────────────────────

.ssh_setup:
  image: alpine:3.23
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 "$ODIN_SSH_KEY"
    - ssh-add "$ODIN_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p 2345 -H "$ODIN_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

.docker_build:
  stage: build
  image: docker:29
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null || docker buildx use ci-builder
    - docker buildx inspect --bootstrap
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

.npm_cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

# ─── Test ──────────────────────────────────────────────────────────────────────

lint-frontend:
  stage: test
  image: node:24-alpine
  interruptible: true
  extends: .npm_cache
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    - npm config set legacy-peer-deps true
    - npm ci
  script:
    - npx prettier --check "src/**/*.{ts,html,js}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

security-scan:
  stage: test
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  interruptible: true
  script:
    - trivy fs --format table --exit-code 0 --severity HIGH,CRITICAL . | tee trivy-results.txt
  artifacts:
    when: always
    paths:
      - trivy-results.txt
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ─── Build ─────────────────────────────────────────────────────────────────────

build-frontend:
  extends: .docker_build
  needs: [lint-frontend]
  script:
    - |
      docker buildx build --platform linux/amd64 \
        --cache-from "type=registry,ref=${CI_REGISTRY_IMAGE}/job-wars-web:cache" \
        --cache-to "type=registry,ref=${CI_REGISTRY_IMAGE}/job-wars-web:cache,mode=max" \
        --tag "${CI_REGISTRY_IMAGE}/job-wars-web:${CI_COMMIT_SHORT_SHA}" \
        --tag "${CI_REGISTRY_IMAGE}/job-wars-web:latest" \
        --push .

# ─── Deploy ────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  extends: .ssh_setup
  needs: [build-frontend]
  environment:
    name: production
    url: https://job-wars.atomstudios.fr
  resource_group: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      ssh -p 2345 -o StrictHostKeyChecking=no "$ODIN_SSH_USER@$ODIN_SSH_HOST" << 'ENDSSH'
        set -e
        export KUBECONFIG=/mnt/cache/k3s/kubeconfig
        kubectl rollout restart deployment/job-wars-web -n apps
        kubectl rollout status deployment/job-wars-web -n apps --timeout=120s
      ENDSSH

# ─── Verify ────────────────────────────────────────────────────────────────────

verify:
  stage: verify
  image: alpine:3.23
  needs: [deploy]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apk add --no-cache curl
    - curl -f -s --retry 5 --retry-delay 10 --retry-all-errors https://job-wars.atomstudios.fr/ > /dev/null && echo "OK"
